<main>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb custom-breadcrumb mb-0" style="padding: 5px 10px; font-size: small;">
            <li class="breadcrumb-item active"><a routerLink="/container0">Container Monitoring</a></li>
        </ol>
    </nav>
    <hr>
    <div class="card-header">
        <div class="pe-3 py-2 col-md-12 d-flex justify-content-between" style="padding-left: 0.3%;">
            <span class="containerHeader">Container Applications</span>
            <div style="position: relative; width: 25%;">
                <input type="text" class="form-control form-control-sm" style="padding-right: 30px;"
                    [(ngModel)]="searchQuery" (input)="onSearch()" placeholder="Search" />
                <i class="fas fa-search"
                    style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: #888; cursor: pointer;"></i>
            </div>
        </div>
    </div>
    <div class="card-body px-2 py-0">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th (click)="onSort('item')" style="cursor: pointer;">Service ID &nbsp;<i class="fa-solid fa-sort"></i></th>
                        <th (click)="onSort('applicationName')" style="cursor: pointer;">Application Name &nbsp;<i class="fa-solid fa-sort"></i></th>
                        <th (click)="onSort('cpu')" style="cursor: pointer;">CPU Usage &nbsp;<i class="fa-solid fa-sort"></i></th>
                    </tr>
                </thead>
                <tbody *ngIf="pagedContainerId.length !== 0">
                    <tr *ngFor="let item of pagedContainerId; let i = index">
                        <td class="text-link" (click)="setServiceId($event)" style="cursor: pointer;">{{item}}</td>
                        <td>{{applicationNameMap[item] || 'No Data'}}</td>
                        <td> {{cpu_usage_arr[item] || 'No Data'}} </td>
                    </tr>
                </tbody>
                <div class="noData d-flex justify-content-center align-items-center"
                    *ngIf="pagedContainerId.length === 0">
                    <h4>No Data Available</h4>
                </div>
            </table>
            <div class="col-12 d-flex justify-content-between" style="margin-top: 10px;">
                <div class="mx-2 pt-1" style="font-size: small; color: rgb(128, 126, 126);">
                    {{ endIndex }}/{{ filteredContainerId.length }}
                </div>
                <nav class="mb-1 mr-1">
                    <ul class="pagination justify-content-center align-items-center"
                        style="font-size: small; gap: 0.5rem;">
                        <li class="page-item" [class.disabled]="currentPage === 1">
                            <button type="button" class="btn btn-sm border-0 py-0 px-2" (click)="previousPage()"
                                [disabled]="currentPage === 1" tabindex="0">
                                <i class="fa-solid fa-angle-left icon-color"></i>
                            </button>
                        </li>

                        <li class="page-item d-flex align-items-center">
                            <input type="number" class="text-center page-input" 
                                [value]="currentPage" (keydown.enter)="goToPage(inputPage.value)" #inputPage min="1"
                                [max]="totalPages" aria-label="Page number input" />
                            <span class="ms-2"> of {{ totalPages }}</span>
                        </li>

                        <li class="page-item" [class.disabled]="currentPage === totalPages">
                            <button type="button" class="btn btn-sm border-0 py-0 px-2" (click)="nextPage()"
                                [disabled]="currentPage === totalPages" tabindex="0">
                                <i class="fa-solid fa-angle-right icon-color"></i>
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>
