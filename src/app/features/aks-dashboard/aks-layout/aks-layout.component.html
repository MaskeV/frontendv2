<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">

      <!-- Home button -->
      <button class="back-btn" (click)="goToAksDashboard()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
      </button>

      <div class="breadcrumb">
        <span
          class="crumb primary"
          [class.clickable]="!!activeDashboardName"
          [style.cursor]="activeDashboardName ? 'pointer' : 'default'"
          (click)="activeDashboardName ? goToDashboards() : null">
          Dashboards
        </span>

        <span *ngIf="activeDashboardName" class="bc-slash">/</span>

        <span *ngIf="activeDashboardName" class="crumb secondary">
          {{ activeDashboardName | titlecase }}
        </span>
      </div>

    </div>
  </div>
</div>

<router-outlet></router-outlet>
