
                    <!-- ================= HEADER ================= -->
                    <div style="margin-top:10px;
        background:#ffffff;border:1px solid #e0e0e0;
        border-radius:8px;padding:10px;
        box-shadow:0 1px 3px rgba(0,0,0,.08);
        display:flex;justify-content:space-between;align-items:center;">

                        <div style="font-size:14px;font-weight:600;color:#333;">
                            <i class="fa-solid fa-globe" style="margin-right:6px;color:#219ebc;"></i>
                            Geographic Regions
                        </div>

                        <select class="form-control" style="height:28px;font-size:12px;width:auto;border-radius:6px;"
                            [(ngModel)]="selectedMetric" (change)="updateMap()">

                            <option value="usagePercent">Usage %</option>
                            <option value="sessions">Sessions</option>
                            <option value="crashes">Crashes</option>
                            <option value="apdex">Apdex</option>
                            <option value="crashPercent">Crash %</option>

                        </select>

                    </div>


                    <!-- ================= MAP ================= -->
                    <div style="margin-top:10px;
        background:#fff;border:1px solid #e0e0e0;
        border-radius:8px;padding:10px;
        box-shadow:0 1px 3px rgba(0,0,0,.08);">

                        <div id="geo-map-service" style="height:450px;width:100%;"></div>

                    </div>


                    <!-- ================= TABLE (SESSIONS STYLE) ================= -->
                    <div class="scrollable2" style="margin-top: 10px;">
                        <div class="rounded-2 p-1 overflow-hidden">

                            <table class="table table-fixed" style="
                font-size: 12px;
                font-family: 'Inter','Segoe UI',sans-serif;
                background: transparent;
            ">

                                <!-- HEADER -->
                                <thead>
                                    <tr style="border-bottom: 1px solid #e0e0e0;">

                                        <th (click)="setSort('countryName')" style="padding: 8px 16px; color:#1565c0;">
                                            <i class="fa-solid fa-flag" style="margin-right:4px;"></i>
                                            Country
                                            <i *ngIf="sortField === 'countryName'"
                                                [ngClass]="sortDirection === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down'">
                                            </i>
                                        </th>

                                        <th (click)="setSort('sessions')" style="padding: 8px 16px; color:#1565c0;">
                                            <i class="fa-solid fa-users" style="margin-right:4px;"></i>
                                            Sessions
                                            <i *ngIf="sortField === 'sessions'"
                                                [ngClass]="sortDirection === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down'">
                                            </i>
                                        </th>

                                        <th (click)="setSort('crashes')" style="padding: 8px 16px; color:#1565c0;">
                                            <i class="fa-solid fa-bug" style="margin-right:4px;"></i>
                                            Crashes
                                            <i *ngIf="sortField === 'crashes'"
                                                [ngClass]="sortDirection === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down'">
                                            </i>
                                        </th>

                                        <th (click)="setSort('apdex')" style="padding: 8px 16px; color:#1565c0;">
                                            <i class="fa-solid fa-gauge-high" style="margin-right:4px;"></i>
                                            Apdex
                                            <i *ngIf="sortField === 'apdex'"
                                                [ngClass]="sortDirection === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down'">
                                            </i>
                                        </th>

                                        <th (click)="setSort('usagePercent')" style="padding: 8px 16px; color:#1565c0;">
                                            <i class="fa-solid fa-chart-pie" style="margin-right:4px;"></i>
                                            Usage %
                                            <i *ngIf="sortField === 'usagePercent'"
                                                [ngClass]="sortDirection === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down'">
                                            </i>
                                        </th>

                                        <th (click)="setSort('crashPercent')" style="padding: 8px 16px; color:#1565c0;">
                                            <i class="fa-solid fa-percent" style="margin-right:4px;"></i>
                                            Crash %
                                            <i *ngIf="sortField === 'crashPercent'"
                                                [ngClass]="sortDirection === 'asc' ? 'fa fa-sort-up' : 'fa fa-sort-down'">
                                            </i>
                                        </th>

                                    </tr>
                                </thead>

                                <!-- BODY -->
                                <tbody>
                                    <tr *ngFor="let row of paginatedData"
                                        style="background:#fafafa;border-bottom:1px solid #eeeeee;">

                                        <td style="padding: 8px 16px;">
                                            {{ row.countryName }}
                                        </td>

                                        <td style="padding: 8px 16px; color:#1565c0;">
                                            {{ row.sessions ?? 'No Data' }}
                                        </td>

                                        <td style="padding: 8px 16px; color:#d84315;">
                                            {{ row.crashes ?? 'No Data' }}
                                        </td>

                                        <td style="padding: 8px 16px; color:#6a1b9a;">
                                            {{ row.apdex ?? 'No Data' }}
                                        </td>

                                        <td style="padding: 8px 16px; color:#1565c0;">
                                            {{ row.usagePercent ?? 'No Data' }}
                                        </td>

                                        <td style="padding: 8px 16px; color:#ef6c00;">
                                            {{ row.crashPercent ?? 'No Data' }}
                                        </td>

                                    </tr>
                                </tbody>

                            </table>

                            <!-- NO DATA -->
                            <div *ngIf="paginatedData.length === 0"
                                style="text-align:center;padding:40px;color:#9e9e9e;font-size:14px;">
                                <strong>No Data</strong>
                            </div>

                        </div>
                    </div>


                    <!-- ================= PAGINATION ================= -->
                    <nav *ngIf="countryData.length" class="mt-2">
                        <ul class="pagination pagination-sm justify-content-center">

                            <li class="page-item" [class.disabled]="mapCurrentPage === 1">
                                <a class="page-link" (click)="changePage(mapCurrentPage - 1)">Previous</a>
                            </li>

                            <li class="page-item" *ngFor="let p of totalPagesArray"
                                [class.active]="p === mapCurrentPage">

                                <a class="page-link" (click)="changePage(p)">{{ p }}</a>

                            </li>

                            <li class="page-item" [class.disabled]="mapCurrentPage === totalPages">
                                <a class="page-link" (click)="changePage(mapCurrentPage + 1)">Next</a>
                            </li>

                        </ul>
                    </nav>
