
                    <!-- ================= FILTERS (SAME AS SESSIONS STYLE) ================= -->
                    <div class="row" style="font-size:12px;margin-top:4px;letter-spacing:.3px;
         background:#ffffff;border:1px solid #e0e0e0;
         border-radius:8px;padding:10px;
         box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0px">

                        <!-- App Version -->
                        <div class="col-md-2">
                            <label style="color:#555;font-weight:600;">App Version</label>
                            <select class="form-control"
                                style="height:26px;font-size:11px;padding:2px 6px;border-radius:6px;"
                                [(ngModel)]="dependencyFilters.appVersion">
                                <option value="">All</option>
                                <option *ngFor="let version of versionList" [value]="version">{{ version }}</option>
                            </select>
                        </div>

                        <!-- Device -->
                        <div class="col-md-2">
                            <label style="color:#555;font-weight:600;">Device</label>
                            <select class="form-control"
                                style="height:26px;font-size:11px;padding:2px 6px;border-radius:6px;"
                                [(ngModel)]="dependencyFilters.device">
                                <option value="">All</option>
                                <option *ngFor="let d of deviceList" [value]="d">{{ d }}</option>
                            </select>
                        </div>

                        <!-- OS Version -->
                        <div class="col-md-2">
                            <label style="color:#555;font-weight:600;">OS Version</label>
                            <select class="form-control"
                                style="height:26px;font-size:11px;padding:2px 6px;border-radius:6px;"
                                [(ngModel)]="dependencyFilters.osVersion">
                                <option value="">All</option>
                                <option *ngFor="let os of osversionList" [value]="os">{{ os }}</option>
                            </select>
                        </div>

                        <!-- Dependency -->
                        <div class="col-md-2">
                            <label style="color:#555;font-weight:600;">Dependency</label>
                            <input type="text" class="form-control"
                                style="height:26px;font-size:11px;padding:2px 6px;border-radius:6px;"
                                [(ngModel)]="dependencyFilters.filter" />
                        </div>

                        <!-- Search -->
                        <div class="col-md-2 d-flex align-items-end">
                            <button style="width:32px;height:32px;border-radius:50%;
               border:1px solid #219ebc;background:#fff;" (click)="getDependencies()" title="Search">
                                <i class="bi bi-search" style="color:#219ebc;"></i>
                            </button>
                        </div>

                    </div>


                    <!-- ================= TABLE (SESSIONS STYLE) ================= -->
                    <div class="scrollable2" style="margin-top: 10px;">
                        <div class="rounded-2 p-1 overflow-hidden">

                            <table class="table table-fixed" style="
                font-size: 12px;
                font-family: 'Inter','Segoe UI',sans-serif;
                background: transparent;
            ">

                                <!-- HEADER -->
                                <thead>
                                    <tr style="border-bottom: 1px solid #e0e0e0;">

                                        <th style="padding: 8px 16px; color:#1565c0;">
                                            Dependency
                                        </th>

                                        <th style="padding: 8px 16px; color:#1565c0;">
                                            Latency (ms)
                                        </th>

                                        <th style="padding: 8px 16px; color:#1565c0;">
                                            Throughput
                                        </th>

                                        <th style="padding: 8px 16px; color:#1565c0;">
                                            Failed Tx (%)
                                        </th>

                                        <th style="padding: 8px 16px; color:#1565c0;">
                                            Apdex
                                        </th>

                                    </tr>
                                </thead>

                                <!-- BODY -->
                                <tbody>
                                    <tr *ngFor="let dependency of paginatedDependency"
                                        style="background:#fafafa;border-bottom:1px solid #eeeeee;">

                                        <!-- Dependency -->
                                        <td style="padding: 8px 16px;">
                                            <a [routerLink]="['/mrum/mrum-dependencies']"
                                                [queryParams]="buildQueryParamsDependencies(dependency.dependency)"
                                                style="color:#1565c0;font-weight:500;text-decoration:none;">
                                                {{ dependency.dependency }}
                                            </a>
                                        </td>

                                        <!-- Latency -->
                                        <td style="padding: 8px 16px; color:#d84315;">
                                            {{ dependency.latency ?? 'No Data' }}
                                        </td>

                                        <!-- Throughput -->
                                        <td style="padding: 8px 16px; color:#1565c0;">
                                            {{ dependency.throughput ?? 'No Data' }}
                                        </td>

                                        <!-- Failure -->
                                        <td style="padding: 8px 16px; color:#ef6c00;">
                                            {{ dependency.failure_rate ?? 'No Data' }}
                                        </td>

                                        <!-- Apdex -->
                                        <td style="padding: 8px 16px; color:#6a1b9a;">
                                            {{ dependency.apdex ?? 'No Data' }}
                                        </td>

                                    </tr>
                                </tbody>

                            </table>

                            <!-- PAGINATION SAME -->
                            <nav *ngIf="totalDependencyPages > 1" class="mt-3">
                                <ul class="pagination pagination-sm justify-content-center">

                                    <li class="page-item" [class.disabled]="currentDependencyPage === 1">
                                        <a class="page-link"
                                            (click)="changeDependencyPage(currentDependencyPage - 1)">Previous</a>
                                    </li>

                                    <li class="page-item" *ngFor="let page of dependencyPaginationPages"
                                        [class.active]="currentDependencyPage === page">

                                        <a class="page-link" (click)="changeDependencyPage(page)">{{ page }}</a>

                                    </li>

                                    <li class="page-item"
                                        [class.disabled]="currentDependencyPage === totalDependencyPages">

                                        <a class="page-link"
                                            (click)="changeDependencyPage(currentDependencyPage + 1)">Next</a>

                                    </li>

                                </ul>
                            </nav>

                            <!-- NO DATA -->
                            <div *ngIf="paginatedDependency.length === 0"
                                style="text-align:center;padding:40px;color:#9e9e9e;font-size:14px;">
                                <strong>No Dependency</strong>
                            </div>

                        </div>
                    </div>
