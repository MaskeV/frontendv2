<div class="container" style=" overflow-x: auto;">
  <div style="display: flex; flex-wrap: nowrap; gap: 8px;">
    <button *ngFor="let service of uniqueServiceCodes" type="button" class="btn btn-outline-primary btn-sm"
      style="padding: 2px 6px; font-size: 10px; white-space: nowrap;" [ngStyle]="{
    'padding': '2px 6px',
    'font-size': '10px',
    'white-space': 'nowrap',
    'background-color': 'white',
    'color': serviceColorMap[service],
    'border-color': serviceColorMap[service]
  }">
      <span [ngStyle]="{
          'display': 'inline-block',
          'width': '8px',
          'height': '8px',
          'border-radius': '50%',
          'border': '1px solid ' + serviceColorMap[service],
          'margin-right': '4px'
        }"></span>
      {{ service }}
    </button>
  </div>
</div>
<div id="treeContainer" style="width: 100%; height: 42vh; position: relative;">
  <div *ngIf="!traceData">
    <p>No trace metadata available.</p>
  </div>
  <div id="tooltip" class="hide-div"></div>
</div>
