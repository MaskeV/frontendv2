<div class="modal-body">
  <button style="font-size: 24px; font-weight: 500; margin-top: -3%; margin-bottom: -5%;" type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body" style="margin-top: -3%;">
  <ul class="list-group">
    <li class="list-group-item" *ngFor="let option of options" (click)="handleOptionClick(option)">
      {{ option }}
    </li>
  </ul>
</div>
