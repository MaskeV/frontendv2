<div *ngIf="!hideControlZone" #dropdownWrapper class="control-zone-wrapper">

  <div class="zone-trigger"
      (click)="toggleDropdown($event)"
      [class.active]="dropdownOpen"
      [class.zone-selected]="selectedZone">
    <span class="zone-label" *ngIf="selectedZone">{{ selectedZone.groupName }}</span>
    <span class="filter-icon-wrap">
      <svg class="filter-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4.25 5.61C6.27 8.2 10 13 10 13v6c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-6s3.72-4.8 5.74-7.39A.998.998 0 0 0 18.95 4H5.04a1 1 0 0 0-.79 1.61z"/>
      </svg>
      <span class="active-badge" *ngIf="selectedZone"></span>
    </span>
    <span class="chevron-icon" [class.open]="dropdownOpen">
      <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 10l5 5 5-5z"/>
      </svg>
    </span>
  </div>
  <div class="cz-dropdown" *ngIf="dropdownOpen" (click)="$event.stopPropagation()">

    <div class="cz-search-box" *ngIf="controlZones.length > 3">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="#999">
        <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input
        type="text"
        placeholder="Search zones..."
        (input)="searchZones($any($event.target).value)"
        class="cz-search-input"
        (click)="$event.stopPropagation()"
      />
    </div>

    <div class="cz-list">

      <div class="cz-option cz-all-option" [class.cz-option-selected]="!selectedZone" (click)="onSelectAll()">
        <div class="cz-option-content">
          <span class="cz-option-name">All Zones</span>
          <span class="cz-option-desc">Show all applications</span>
        </div>
        <span class="cz-check" *ngIf="!selectedZone">✓</span>
      </div>

      <div
        class="cz-option"
        *ngFor="let zone of filteredControlZones"
        (click)="onZoneSelect(zone)"
        [class.cz-option-selected]="selectedZone?.id === zone.id"
      >
        <div class="cz-option-content">
          <span class="cz-option-name">{{ zone.groupName }}</span>
          <span class="cz-option-desc" *ngIf="zone.description">{{ zone.description }}</span>
          <span class="cz-option-desc" *ngIf="!zone.description">{{ zone.mappings.length || 0 }} applications</span>
        </div>
        <span class="cz-check" *ngIf="selectedZone?.id === zone.id">✓</span>
      </div>

      <div class="cz-empty" *ngIf="filteredControlZones.length === 0">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#ccc">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <span>No zones found</span>
      </div>
    </div>
  </div>

  <div class="cz-loading" *ngIf="isLoading">
    <div class="cz-spinner"></div>
  </div>
</div>
